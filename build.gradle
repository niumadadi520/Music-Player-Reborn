plugins { id 'java-library'; id 'com.gradleup.shadow' version '8.3.6'; id 'net.neoforged.moddev' version '2.0.107' }
version='1.0.0-neoforge+mc1.21.1'
group='com.mengsama.mod'
base { archivesName='MengSamaNetMusic' }
java { toolchain.languageVersion=JavaLanguageVersion.of(21); withSourcesJar() }
neoForge {
    version='21.1.248'
    accessTransformers.from 'dev/maid-accesstransformer.cfg'
    addModdingDependenciesTo(sourceSets.test)
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { mengsamanetmusic { sourceSet sourceSets.main } }
}
repositories {
    mavenCentral()
    maven { url='https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url='https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url='https://maven.theillusivec4.top/' }
}
configurations { bundled; implementation.extendsFrom bundled }
dependencies {
    bundled 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    bundled 'com.google.zxing:core:3.5.4'
    bundled files('libs/javasound-aac-0.9.6.jar','libs/jflac-codec-1.5.3-SNAPSHOT.jar')
    compileOnly files('libs/voicechat-api-2.6.20.jar')
    testImplementation files('libs/voicechat-api-2.6.20.jar')
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.6.6'
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    testCompileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    compileOnly 'maven.modrinth:sophisticated-core:PXl6rB3q'
    testImplementation 'maven.modrinth:sophisticated-core:PXl6rB3q'
    compileOnly 'maven.modrinth:sophisticated-backpacks:AhPnzNtJ'
    testImplementation 'maven.modrinth:sophisticated-backpacks:AhPnzNtJ'
    compileOnly 'maven.modrinth:touhou-little-maid:tXG1TkGx'
    testImplementation 'maven.modrinth:touhou-little-maid:tXG1TkGx'
    compileOnly 'maven.modrinth:jade:eYz2YBGT'
    testImplementation 'maven.modrinth:jade:eYz2YBGT'
    compileOnly 'maven.modrinth:cloth-config:izKINKFg'
    testImplementation 'maven.modrinth:cloth-config:izKINKFg'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm:9.7.1'
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.fork=true; options.forkOptions.jvmArgs=['-Duser.language=en','-Duser.country=US','-Dfile.encoding=UTF-8']; options.compilerArgs += ['-Xmaxerrs','500'] }
processResources { inputs.property 'mod_version',project.version; filesMatching('META-INF/neoforge.mods.toml') { expand mod_version:project.version } }
shadowJar {
    archiveClassifier=''
    configurations=[project.configurations.bundled]
    relocate 'javazoom.jl','com.mengsama.mod.mengsamanetmusic.libs.javazoom.jl'
    relocate 'javazoom.spi','com.mengsama.mod.mengsamanetmusic.libs.javazoom.spi'
    relocate 'org.tritonus','com.mengsama.mod.mengsamanetmusic.libs.org.tritonus'
    relocate 'org.jflac','com.mengsama.mod.mengsamanetmusic.libs.org.jflac'
    relocate 'net.sourceforge.jaad','com.mengsama.mod.mengsamanetmusic.libs.net.sourceforge.jaad'
    relocate 'com.google.zxing','com.mengsama.mod.mengsamanetmusic.libs.zxing'
    mergeServiceFiles()
    exclude 'META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA'
}
jar { archiveClassifier='slim' }
assemble.dependsOn shadowJar
test { useJUnitPlatform(); dependsOn shadowJar; systemProperty 'mengsama.releaseJar',tasks.shadowJar.archiveFile.get().asFile.absolutePath; systemProperty 'mengsama.liveTests','false' }

 
tasks.named('test').configure {
    maxHeapSize='2G'
    systemProperty 'mengsama.productionJar',layout.buildDirectory.file('moddev/artifacts/neoforge-21.1.248.jar').get().asFile.absolutePath
    doFirst {
        if (System.getProperty('os.name').startsWith('Windows') && classpath.files.any { it.path.any { ch -> (int)ch > 127 } }) {
            def stage=new File(System.getProperty('java.io.tmpdir'),'mengsama-neoforge-test-'+UUID.randomUUID())
            extensions.extraProperties.set('testClasspathStage',stage)
            int index=0
            classpath=files(classpath.files.collect { original ->
                if(original.path.every { ch -> (int)ch < 128 })return original
                def destination=new File(stage,'entry-'+index++)
                copy { from original; into destination }
                return original.isDirectory()?destination:new File(destination,original.name)
            })
        }
    }
}

 
tasks.register('cleanTestClasspathStage') {
    doLast {
        def testTask=tasks.named('test').get()
        if (testTask.extensions.extraProperties.has('testClasspathStage')) {
            def stage=testTask.extensions.extraProperties.get('testClasspathStage')
            def temporaryRoot=new File(System.getProperty('java.io.tmpdir')).canonicalFile
            if(stage.canonicalFile.parentFile != temporaryRoot || !stage.name.startsWith('mengsama-neoforge-test-'))
                throw new GradleException('Unexpected test staging path')
            delete stage
        }
    }
}
tasks.named('test').configure { finalizedBy 'cleanTestClasspathStage' }
